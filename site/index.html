  <style>
    /* Cabinet Grotesk and Switzer are Fontshare faces (not on Google Fonts) — loaded via Fontshare's CDN below. Space Grotesk above is the safety fallback while Fontshare loads. */
  </style>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">

      </div>
    </main>

  <script src="js/density.js?v=15"></script>
