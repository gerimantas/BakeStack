<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BakeStack — recipes &amp; baking tips</title>
  <meta name="description" content="A personal recipe and baking-tips database with scaling, cost estimates, and a shopping list.">
  <meta name="color-scheme" content="light dark">
  <!-- One SVG at every size; it carries its own dark background, so it needs no light/dark
       variants and no separate .ico. Drawn to stay legible at 16px — see the file's own notes. -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Makes the site installable: Android reads this to offer "Install app" and to decide the
       icon, splash colours and orientation. orientation:"any" is deliberate — the reader's
       rotation lock should win, and nothing in the layout needs a fixed orientation. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e8763a">
  <!-- Four font hosts are involved: two stylesheet origins and the two CDNs the faces
       themselves come from. Without preconnect the browser only discovers the CDNs after
       parsing each stylesheet, paying DNS + TLS again mid-load. Fontshare serves one family
       per request (a combined f[]= URL silently returns only the first), so the two
       Fontshare links cannot be merged. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- ?v= is a cache-buster: bump it whenever css/ or js/ changes, so browsers fetch the
       new file instead of serving a stale cached copy. Data files handle this themselves
       (see fetchJSON in js/data.js). -->
  <link rel="stylesheet" href="css/tokens.css?v=48">
  <link rel="stylesheet" href="css/app.css?v=48">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <header class="nav" id="nav-slot"></header>
    <main class="main" id="main">
      <div class="container">
        <div class="empty-state"><h2>Loading…</h2></div>
      </div>
    </main>
    <div id="footer-slot"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" data-visible="false"></div>
  <!-- Outside .app-shell so a re-render never replaces them; labels are set per language in JS. -->
  <div class="jump-nav" id="jump-nav" data-visible="false">
    <button type="button" class="jump-nav__btn" id="jump-top">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button type="button" class="jump-nav__btn" id="jump-bottom">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <script src="js/data.js?v=48"></script>
  <script src="js/i18n.js?v=48"></script>
  <script src="js/state.js?v=48"></script>
  <script src="js/app.js?v=48"></script>
</body>
</html>
