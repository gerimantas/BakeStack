<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BakeStack QA — DOCx vs JSON compare</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --border: #d8d2c4;
    --text: #2a241c;
    --muted: #7a7264;
    --accent: #b5622f;
    --ok: #2f7d4f;
    --ok-bg: #e5f3ea;
    --missing: #b3261e;
    --missing-bg: #fbe9e7;
    --extra: #a06a00;
    --extra-bg: #fdf0d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    white-space: nowrap;
  }
  select, input[type="text"] {
    font-size: 14px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  #datasetSelect { min-width: 100px; }
  #itemSelect { min-width: 320px; flex: 1; }
  #searchBox { min-width: 180px; }
  .counts {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok); }
  .badge-missing { background: var(--missing-bg); color: var(--missing); }
  .badge-extra { background: var(--extra-bg); color: var(--extra); }

  nav.jump {
    padding: 8px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  nav.jump button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    margin-right: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  nav.jump button:hover { background: var(--bg); }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 20px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    min-height: 200px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .docx-body {
    white-space: pre-wrap;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .docx-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .empty-state {
    color: var(--muted);
    font-style: italic;
    padding: 20px 0;
  }

  .json-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .json-desc { color: var(--muted); font-size: 13.5px; margin-bottom: 14px; }
  .field-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin: 14px 0 4px;
  }
  .field-label:first-of-type { margin-top: 0; }
  ul.ingredients { margin: 0; padding-left: 20px; font-size: 14px; }
  ul.ingredients li { margin-bottom: 3px; }
  ol.steps { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.5; }
  ol.steps li { margin-bottom: 8px; }
  .raw-json {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    background: #f7f5ef;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    white-space: pre-wrap;
    max-height: 260px;
    overflow: auto;
    margin-top: 14px;
  }
  details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>QA Compare</h1>
  <select id="datasetSelect">
    <option value="recipes">Recipes</option>
    <option value="tips">Tips</option>
  </select>
  <input type="text" id="searchBox" placeholder="Filter list…">
  <select id="itemSelect"></select>
  <span class="counts" id="counts"></span>
</header>

<nav class="jump">
  Jump to:
  <button data-filter="all">All</button>
  <button data-filter="missing">Missing in JSON</button>
  <button data-filter="extra">Extra in JSON</button>
</nav>

<main>
  <section class="panel">
    <h2>DOCx source <span id="docxBadge"></span></h2>
    <div id="docxPane"><p class="empty-state">Select an item above.</p></div>
  </section>
  <section class="panel">
    <h2>Generated (JSON) <span id="jsonBadge"></span></h2>
    <div id="jsonPane"><p class="empty-state">Select an item above.</p></div>
  </section>
</main>

<script>
let DATA = null;
let currentRows = [];
let filterMode = 'all';

fetch('qa-compare-data.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    initDatasetSelect();
  })
  .catch(err => {
    document.getElementById('docxPane').innerHTML =
      '<p class="empty-state">Failed to load qa-compare-data.json — run: node scripts/build-qa-compare.js</p>';
    console.error(err);
  });

function initDatasetSelect() {
  document.getElementById('datasetSelect').addEventListener('change', refreshList);
  document.getElementById('searchBox').addEventListener('input', refreshList);
  document.querySelectorAll('.jump button').forEach(btn => {
    btn.addEventListener('click', () => {
      filterMode = btn.dataset.filter;
      refreshList();
    });
  });
  document.getElementById('itemSelect').addEventListener('change', renderSelected);
  refreshList();
}

function rowStatus(row) {
  if (!row.json) return 'missing';
  if (!row.docx) return 'extra';
  return 'ok';
}

function refreshList() {
  const dataset = document.getElementById('datasetSelect').value;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const rows = DATA[dataset];

  currentRows = rows.filter(r => {
    if (filterMode !== 'all' && rowStatus(r) !== filterMode) return false;
    if (q && !r.title.toLowerCase().includes(q)) return false;
    return true;
  });

  const sel = document.getElementById('itemSelect');
  sel.innerHTML = '';
  currentRows.forEach((r, i) => {
    const opt = document.createElement('option');
    const status = rowStatus(r);
    const marker = status === 'ok' ? '✓' : status === 'missing' ? '✗ missing JSON' : '+ extra JSON';
    opt.value = i;
    opt.textContent = `${marker} — ${r.title}`;
    sel.appendChild(opt);
  });

  const total = rows.length;
  const missing = rows.filter(r => rowStatus(r) === 'missing').length;
  const extra = rows.filter(r => rowStatus(r) === 'extra').length;
  const ok = total - missing - extra;
  document.getElementById('counts').textContent =
    `${total} total · ${ok} matched · ${missing} missing · ${extra} extra`;

  if (currentRows.length) {
    sel.selectedIndex = 0;
    renderSelected();
  } else {
    document.getElementById('docxPane').innerHTML = '<p class="empty-state">No items match this filter.</p>';
    document.getElementById('jsonPane').innerHTML = '<p class="empty-state">No items match this filter.</p>';
    document.getElementById('docxBadge').innerHTML = '';
    document.getElementById('jsonBadge').innerHTML = '';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderSelected() {
  const idx = document.getElementById('itemSelect').value;
  const row = currentRows[idx];
  if (!row) return;

  const status = rowStatus(row);
  const badgeHtml = status === 'ok'
    ? '<span class="badge badge-ok">match</span>'
    : status === 'missing'
    ? '<span class="badge badge-missing">missing in JSON</span>'
    : '<span class="badge badge-extra">not a DOCx H2</span>';
  document.getElementById('docxBadge').innerHTML = badgeHtml;
  document.getElementById('jsonBadge').innerHTML = badgeHtml;

  const docxPane = document.getElementById('docxPane');
  if (row.docx !== null) {
    docxPane.innerHTML =
      `<div class="docx-title">${escapeHtml(row.title)}</div>` +
      `<div class="docx-body">${escapeHtml(row.docx)}</div>`;
  } else {
    docxPane.innerHTML =
      `<div class="docx-title">${escapeHtml(row.title)}</div>` +
      `<p class="empty-state">No matching "## " heading in the DOCx-derived .md — this JSON entry came from a subsection (e.g. an H3) that the parser split out on its own.</p>`;
  }

  const jsonPane = document.getElementById('jsonPane');
  if (row.json) {
    jsonPane.innerHTML = renderJsonEntry(row.json);
  } else {
    jsonPane.innerHTML =
      `<div class="json-title">${escapeHtml(row.title)}</div>` +
      `<p class="empty-state">No entry in this JSON file with this title. This DOCx section was not carried into the generated site.</p>`;
  }
}

function renderJsonEntry(entry) {
  let html = `<div class="json-title">${escapeHtml(entry.title)}</div>`;
  if (entry.description) {
    html += `<div class="json-desc">${escapeHtml(entry.description)}</div>`;
  }
  if (entry.category) {
    html += `<div class="field-label">Category</div><div>${escapeHtml(entry.category)}</div>`;
  }
  if (entry.servings) {
    html += `<div class="field-label">Servings</div><div>${escapeHtml(entry.servings)}</div>`;
  }
  if (entry.ingredients && entry.ingredients.length) {
    html += `<div class="field-label">Ingredients (${entry.ingredients.length})</div><ul class="ingredients">`;
    entry.ingredients.forEach(ing => {
      const amt = ing.amount != null ? ing.amount : '';
      const unit = ing.unit ? ' ' + ing.unit : '';
      html += `<li>${escapeHtml(String(amt))}${escapeHtml(unit)} ${escapeHtml(ing.name)}</li>`;
    });
    html += `</ul>`;
  }
  if (entry.steps && entry.steps.length) {
    html += `<div class="field-label">Steps (${entry.steps.length})</div><ol class="steps">`;
    entry.steps.forEach(s => { html += `<li>${escapeHtml(s)}</li>`; });
    html += `</ol>`;
  }
  if (entry.text) {
    html += `<div class="field-label">Text</div><div class="docx-body">${escapeHtml(entry.text)}</div>`;
  }
  html += `<details><summary>Raw JSON</summary><div class="raw-json">${escapeHtml(JSON.stringify(entry, null, 2))}</div></details>`;
  return html;
}
</script>

</body>
</html>
